<html lang="en">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Jefrin | Frontend Developer</title>

    <meta

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #0b1120;
            color: #f8fafc;
            line-height: 1.6;
        }

        a {

        .container {

        }

        header {

        }

            height: 80px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #60a5fa;
        }

        nav ul {
            display: flex;
            gap: 28px;
            list-style: none;
        }

        nav a {
            color: #cbd5e1;
            transition: 0.3s;
        }

        nav a:hover {
            color: #60a5fa;
        }

            display: inline-block;
            padding: 8px 15px;
            border: 1px solid #334155;
            border-radius: 30px;
            color: #93c5fd;
            background: #111827;
            margin-bottom: 25px;
        }

        h1 {
            font-size: clamp(45px, 8vw, 82px);
            line-height: 1.05;
            margin-bottom: 20px;
        }

        h1 span {
            color: #60a5fa;
        }

        .hero p {
            max-width: 650px;
            color: #94a3b8;
            font-size: 19px;
            margin-bottom: 30px;
        }

        .buttons {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 13px 22px;
            border-radius: 8px;
            font-weight: bold;
            display: inline-block;
            transition: 0.3s;
        }

        .primary {
            background: #2563eb;
        }

        .primary:hover {
            background: #1d4ed8;
            transform: translateY(-2px);
        }

        .secondary {
            border: 1px solid #475569;
            color: #cbd5e1;
        }

        .secondary:hover {
            border-color: #60a5fa;
            color: #60a5fa;
        }

        section {
            padding: 100px 0;
        }

            font-size: 38px;
            margin-bottom: 12px;
        }

        .section-subtitle {
            color: #94a3b8;
            margin-bottom: 45px;
        }

        .about {
            background: #0f172a;
        }

        .about-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 50px;
            align-items: center;
        }

        .about-text p {
            color: #94a3b8;
            margin-bottom: 18px;
